<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090817">
<title>Alpha Baby Premium</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090817;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:18px;display:flex;align-items:center;
 justify-content:space-between;
 background:#111026;position:sticky;top:0;z-index:5;
 border-bottom:1px solid #30264b;
}
.logo{font-size:20px;font-weight:bold;color:#b99aff}
.logo span{color:white}
button{
 border:0;border-radius:10px;padding:11px 15px;
 background:#8255ed;color:white;font-weight:bold;
 cursor:pointer;
}
main{padding:18px;max-width:1100px;margin:auto}
.hero{
 padding:25px;border-radius:18px;
 background:linear-gradient(120deg,#35205e,#17152e,#102c42);
 margin-bottom:22px;
}
.hero h1{font-size:29px;margin:8px 0}
.hero p{color:#d4cbea}
.search{
 width:100%;padding:15px;border-radius:12px;
 border:1px solid #41365d;background:#17152a;
 color:white;font-size:16px;margin:12px 0 18px;
}
.categories{display:flex;gap:9px;overflow:auto;padding:5px 0 15px}
.categories button{white-space:nowrap;background:#24213a}
.categories button.active{background:#8255ed}
h2{font-size:20px}
.grid{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:13px;
}
.card{
 background:#17152a;border:1px solid #302a47;
 border-radius:14px;overflow:hidden;cursor:pointer;
}
.card img{
 width:100%;aspect-ratio:16/9;object-fit:cover;
 background:#29233d;
}
.info{padding:11px}
.info b{font-size:14px;line-height:1.5}
.info small{display:block;color:#aaa;margin-top:6px}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{padding:8px;font-size:12px}
#player{
 display:none;position:fixed;inset:0;
 z-index:10;background:#090817;padding:18px;
 overflow:auto;
}
.playerbox{max-width:850px;margin:35px auto}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px}
.close{background:#39334d;margin-bottom:15px}
.empty{
 text-align:center;padding:35px 15px;
 background:#17152a;border-radius:15px;color:#bbb;
}
footer{text-align:center;padding:25px;color:#777;font-size:12px}
@media(min-width:700px){
 .grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<header>
 <div class="logo">ALPHA BABY <span>PREMIUM</span></div>
 <button onclick="addVideo()">+ Add Video</button>
</header>

<main>
 <section class="hero">
  <div>✦ YOUR PERSONAL VIDEO SPACE</div>
  <h1>Welcome to Alpha Baby</h1>
  <p>Discover. Watch. Enjoy.</p>
  <button onclick="addVideo()">Explore Videos →</button>
 </section>

 <input id="search" class="search"
 placeholder="🔍 Search your videos..."
 oninput="render()">

 <div class="categories">
  <button class="active" onclick="filter('All',this)">All</button>
  <button onclick="filter('Music',this)">Music</button>
  <button onclick="filter('Education',this)">Education</button>
  <button onclick="filter('Entertainment',this)">Entertainment</button>
  <button onclick="filter('Favorites',this)">♥ Favorites</button>
 </div>

 <h2>▶ Your Video Library</h2>
 <div class="grid" id="videos"></div>
</main>

<div id="player">
 <div class="playerbox">
  <button class="close" onclick="closePlayer()">← Back</button>
  <div id="videoFrame"></div>
  <h2 id="videoTitle"></h2>
  <p style="color:#aaa">ALPHA BABY PREMIUM</p>
 </div>
</div>

<footer>© 2026 Alpha Baby Premium | Made with ♥</footer>

<script>
let videos=JSON.parse(localStorage.getItem('abVideos')||'[]');
let favorites=JSON.parse(localStorage.getItem('abFav')||'[]');
let category='All';

function save(){
 localStorage.setItem('abVideos',JSON.stringify(videos));
 localStorage.setItem('abFav',JSON.stringify(favorites));
}

function getId(url){
 try{
  let u=new URL(url);
  if(u.hostname==='youtu.be')
   return u.pathname.slice(1).split('/')[0];
  if(u.searchParams.get('v'))
   return u.searchParams.get('v');
  let m=u.pathname.match(/\/(?:embed|shorts)\/([^/?]+)/);
  return m?m[1]:'';
 }catch(e){return '';}
}

function addVideo(){
 let url=prompt('YouTube Video Link paste karein:');
 if(!url)return;
 let id=getId(url);
 if(!/^[a-zA-Z0-9_-]{11}$/.test(id)){
  alert('Valid YouTube video link paste karein.');
  return;
 }
 let title=prompt('Video ka naam likhein:');
 if(!title)return;
 let type=prompt('Category: Music, Education, Entertainment','Entertainment');
 videos.unshift({
  id:id,title:title,
  type:type||'Entertainment'
 });
 save();render();
}

function filter(type,btn){
 category=type;
 document.querySelectorAll('.categories button')
 .forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 render();
}

function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let list=videos.filter(v=>{
  let match=v.title.toLowerCase().includes(q);
  let cat=category==='All'||v.type.toLowerCase()===category.toLowerCase();
  if(category==='Favorites')cat=favorites.includes(v.id);
  return match&&cat;
 });

 let box=document.getElementById('videos');
 box.innerHTML='';

 if(!list.length){
  box.innerHTML='<div class="empty">No videos yet.<br><br>Tap + Add Video to add your first video.</div>';
  return;
 }

 list.forEach(v=>{
  let card=document.createElement('div');
  card.className='card';

  let img=document.createElement('img');
  img.src='https://img.youtube.com/vi/'+v.id+'/hqdefault.jpg';
  img.alt=v.title;

  let info=document.createElement('div');
  info.className='info';

  let title=document.createElement('b');
  title.textContent=v.title;

  let small=document.createElement('small');
  small.textContent='YouTube • '+v.type;

  let actions=document.createElement('div');
  actions.className='actions';

  let play=document.createElement('button');
  play.textContent='▶ Play';
  play.onclick=()=>openPlayer(v);

  let fav=document.createElement('button');
  fav.textContent=favorites.includes(v.id)?'♥ Saved':'♡ Save';
  fav.onclick=()=>{
   if(favorites.includes(v.id)){
    favorites=favorites.filter(x=>x!==v.id);
   }else{favorites.push(v.id);}
   save();render();
  };

  let del=document.createElement('button');
  del.textContent='Remove';
  del.style.background='#39334d';
  del.onclick=()=>{
   if(confirm('Remove this video?')){
    videos=videos.filter(x=>x.id!==v.id);
    favorites=favorites.filter(x=>x!==v.id);
    save();render();
   }
  };

  actions.append(play,fav,del);
  info.append(title,small,actions);
  card.append(img,info);
  card.onclick=e=>{
   if(e.target.tagName==='IMG')openPlayer(v);
  };
  box.append(card);
 });
}

function openPlayer(v){
 document.getElementById('videoTitle').textContent=v.title;
 document.getElementById('videoFrame').innerHTML='';
 let frame=document.createElement('iframe');
 frame.src='https://www.youtube-nocookie.com/embed/'+
 v.id+'?autoplay=1&rel=0';
 frame.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share';
 frame.allowFullscreen=true;
 document.getElementById('videoFrame').append(frame);
 document.getElementById('player').style.display='block';
}

function closePlayer(){
 document.getElementById('player').style.display='none';
 document.getElementById('videoFrame').innerHTML='';
}

render();
</script>
</body>
</html>
