
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AlphaYouTube Vanced - Fixed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}
body{background:#0f0f0f;color:#fff;padding-bottom:70px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#0f0f0f;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:20px}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 12px;white-space:nowrap}
.chips span{background:#272727;padding:7px 14px;border-radius:8px;font-size:14px;cursor:pointer}
.chips span.active{background:#fff;color:#000}
.card{margin-bottom:12px;background:#0f0f0f;cursor:pointer}
.thumb{aspect-ratio:16/9;background:#222} .thumb img{width:100%;height:100%;object-fit:cover}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#212121;display:flex;justify-content:space-around;padding:8px 0}
.bottom div{text-align:center;font-size:11px;color:#aaa}
#player{position:fixed;inset:0;background:#000;z-index:100;display:none}
#q{background:#121212;border:1px solid #333;color:#fff;padding:8px 12px;border-radius:20px;flex:1;margin:0 10px;outline:none}
</style>
</head>
<body>
<header>
<div class="logo">▶️ AlphaYouTube</div>
<input id="q" placeholder="Kalu Bihari gana search karo...">
<button onclick="searchVanced()" style="background:#ff0000;border:0;color:#fff;padding:8px 14px;border-radius:20px;font-weight:700">Search</button>
</header>
<div class="chips">
<span class="active" onclick="setChip('bhojpuri song',this)">All</span>
<span onclick="setChip('bhojpuri music',this)">Music</span>
<span onclick="setChip('bhojpuri mix',this)">Mixes</span>
<span onclick="setChip('bhojpuri live',this)">Live</span>
<span onclick="setChip('bhojpuri cinema',this)">Bhojpuri cinema</span>
<span onclick="setChip('kalu bihari bhojpuri',this)">Kalu Bihari</span>
<span onclick="setChip('pawan singh new song',this)">Pawan Singh</span>
</div>
<div id="grid" style="padding:10px"></div>
<div class="bottom">
<div>🏠<br>HOME</div><div>⚡<br>Shorts</div><div>➕<br>SUBSCRIPTIONS</div><div>📚<br>LIBRARY</div>
</div>
<div id="player">
<div style="padding:10px;display:flex;justify-content:space-between"><span onclick="document.getElementById('player').style.display='none'">← Back</span><span>Alpha Vanced • No Ads</span></div>
<div id="box" style="aspect-ratio:16/9;background:#000"></div>
<h3 id="vt" style="padding:12px"></h3>
</div>
<script>
let DB=[
{id:'lVhJ1r2a8T8',t:'Kalu Bihari - Bhojpuri Hit Song 2024',c:'Bhojpuri Music World'},
{id:'dQw4w9WgXcQ',t:'Pawan Singh New Bhojpuri Song Mix',c:'Bhojpuri Cinema'},
{id:'jNQXAC9IVRw',t:'Bhojpuri Shorts - Trending Video',c:'Shorts Bhojpuri'},
{id:'kJQP7kiw5Fk',t:'Khesari Lal Yadav Superhit Bhojpuri',c:'Bhojpuri Songs'},
{id:'OPf0YbXqDm0',t:'Bhojpuri Cinema Full Movie Mix',c:'Bhojpuri Cinema'},
{id:'9bZkp7q19f0',t:'Live Bhojpuri Stage Show - Aurangabad',c:'Live Bhojpuri'}
];
function setChip(q,el){
document.querySelectorAll('.chips span').forEach(s=>s.classList.remove('active'));
if(el)el.classList.add('active');
document.getElementById('q').value=q;
searchVanced();
}
function searchVanced(){
let q=(document.getElementById('q').value||'bhojpuri song').toLowerCase();
let grid=document.getElementById('grid');
let filtered=DB.filter(v=>v.t.toLowerCase().includes(q.split(' ')[0]) || q.includes('bhojpuri') || q.includes('kalu') || q.includes('pawan'));
if(filtered.length==0)filtered=DB;
grid.innerHTML=filtered.map(v=>`<div class="card" onclick="playV('${v.id}','${v.t}')">
<div class="thumb"><img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg"></div>
<div style="padding:8px"><div style="font-size:14px">${v.t}</div><div style="font-size:12px;color:#aaa">${v.c}</div></div></div>`).join('');
// Try real youtube search in background
fetch('https://pipedapi.kavin.rocks/search?q='+encodeURIComponent(q)).then(r=>r.json()).then(d=>{
if(d.items){
let real=d.items.filter(x=>x.type==='stream').slice(0,12).map(v=>{
let id=v.url.split('v=')[1]||v.url.split('/').pop();
return `<div class="card" onclick="playV('${id}','${v.title.replace(/'/g,'')}')">
<div class="thumb"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"></div>
<div style="padding:8px"><div style="font-size:14px">${v.title}</div><div style="font-size:12px;color:#aaa">${v.uploaderName}</div></div></div>`;
}).join('');
if(real) grid.innerHTML=real+grid.innerHTML;
}
}).catch(()=>{});
}
function playV(id,title){
document.getElementById('player').style.display='block';
document.getElementById('vt').innerText=title;
document.getElementById('box').innerHTML=`<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?autoplay=1&controls=1&rel=0&modestbranding=1" frameborder="0" allowfullscreen></iframe>`;
}
searchVanced();
</script>
</body>
</html>
