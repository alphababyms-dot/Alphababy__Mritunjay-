<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALPHA BABY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;width:100%;max-width:380px;padding:30px;border-radius:18px;text-align:center}
.logo{font-size:30px;font-weight:900}.logo span{color:#667eea}
input{width:100%;padding:13px;border:2px solid #eee;border-radius:10px;margin:10px 0;font-size:15px}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin:6px 0}
.btn-green{background:#25D366;color:#fff}.btn-blue{background:#667eea;color:#fff}
.note{background:#f0f4ff;padding:10px;border-radius:8px;font-size:11px;color:#666;margin-top:12px;text-align:left}
</style>
</head>
<body>
<div class="box">
<div class="logo">ALPHA <span>BABY</span></div>
<p style="color:#888;margin-bottom:20px;font-size:13px">Mritunjay's Brand</p>

<div id="s1">
<input type="tel" id="phone" placeholder="Apna number likho">
<button class="btn btn-green" onclick="askKey()">📱 Admin Se Key Mango</button>
<div class="note">Button dabate hi Admin ke WhatsApp pe request jayega. Bina Admin Key ke login nahi hoga.</div>
</div>

<div id="s2" style="display:none">
<div style="background:#d4edda;color:#155724;padding:8px;border-radius:6px;font-size:12px">✅ Request bhej diya! Admin se Key lo.</div>
<input type="text" id="k" placeholder="Key yahan likho">
<button class="btn btn-blue" onclick="check()">🚀 LOGIN</button>
<button class="btn" style="background:#eee" onclick="location.reload()">Wapas</button>
</div>
</div>

<script>
const _0x = ["QWxQSEEyMDI2","QWxQSEFCQUJZ","TVJJVFVOQUpBWTEyMw=="];
function askKey(){
let p=document.getElementById('phone').value;
if(p.length<10){alert("Sahi number likho");return;}
window.open("https://wa.me/918252004274?text="+encodeURIComponent("Hi Mritunjay Bhai! ALPHA BABY login ke liye Key de do. Mera No: "+p),"_blank");
document.getElementById('s1').style.display='none';
document.getElementById('s2').style.display='block';
}
function check(){
let v=document.getElementById('k').value.trim().toUpperCase();
let ok=_0x.map(x=>atob(x).toUpperCase());
if(ok.includes(v)){
alert("✅ Welcome to ALPHA BABY");
document.body.innerHTML="<div style='height:100vh;display:flex;align-items:center;justify-content:center;background:#667eea;color:#fff;font-size:22px;text-align:center'>Welcome to<br>ALPHA BABY 👑<br><br>Login Successful</div>";
}else{
alert("❌ Galat Key! Admin se sahi Key mango.");
}
}
</script>
</body>
</html>
