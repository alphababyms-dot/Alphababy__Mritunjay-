<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AlphaYouTube Vanced</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}
body{background:#0f0f0f;color:#fff;padding-bottom:70px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#0f0f0f;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px;display:flex;align-items:center;gap:6px}
.logo i{width:32px;height:22px;background:linear-gradient(90deg,#ff0000,#ff7a00,#00ff88,#0088ff);border-radius:6px;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 12px;white-space:nowrap;scrollbar-width:none}
.chips span{background:#272727;padding:7px 14px;border-radius:8px;font-size:14px}
.chips span.active{background:#fff;color:#000}
.card{margin-bottom:12px;background:#0f0f0f}
.thumb{position:relative;aspect-ratio:16/9;background:#222}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .audio{position:absolute;right:10px;top:50%;background:rgba(0,0,0,.7);padding:6px;border-radius:50%;font-size:12px;transform:translateY(-50%)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#212121;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #333}
.bottom div{text-align:center;font-size:11px;color:#aaa}
.bottom div.active{color:#fff}
.bottom div i{font-size:20px;display:block}
#player{position:fixed;inset:0;background:#000;z-index:100;display:none;overflow:auto}
#q{background:#121212;border:1px solid #333;color:#fff;padding:8px 12px;border-radius:20px;flex:1;margin:0 10px;outline:none}
</style>
</head>
<body>
<header>
<div class="logo"><i>▶</i> AlphaYouTube</div>
<input id="q" placeholder="Search Bhojpuri gana..." onkeydown="if(event.key==='Enter')searchVanced()">
<span style="font-size:20px">🔔</span>
</header>

<div class="chips" id="chips">
<span class="active" onclick="setChip(this,'bhojpuri song')">All</span>
<span onclick="setChip(this,'bhojpuri music')">Music</span>
<span onclick="setChip(this,'bhojpuri mix')">Mixes</span>
<span onclick="setChip(this,'bhojpuri live')">Live</span>
<span onclick="setChip(this,'bhojpuri cinema')">Bhojpuri cinema</span>
<span onclick="setChip(this,'kalu bihari')">Kalu Bihari</span>
<span onclick="setChip(this,'pawan singh')">Pawan Singh</span>
</div>

<div id="grid"></div>

<div class="bottom">
<div class="active"><i>🏠</i>HOME</div>
<div onclick="setChip(null,'shorts bhojpuri')"><i>⚡</i>Shorts</div>
<div><i>➕</i>SUBSCRIPTIONS</div>
<div><i>📚</i>LIBRARY</div>
</div>

<div id="player">
<div style="padding:10px;display:flex;justify-content:space-between"><span onclick="this.parentElement.parentElement.style.display='none'">← Back</span><span style="font-size:12px">AlphaYouTube Vanced • No Ads</span></div>
<div id="box" style="aspect-ratio:16/9;background:#000"></div>
<h3 id="vt" style="padding:12px;font-size:16px"></h3>
<button onclick="toggleAudio()" style="margin:12px;background:#272727;border:0;color:#fff;padding:8px 14px;border-radius:20px">🎧 Background Play (Vanced Feature)</button>
</div>

<script>
let audioMode=false;
function setChip(el,q){
document.querySelectorAll('.chips span').forEach(s=>s.classList.remove('active'));
if(el)el.classList.add('active');
document.getElementById('q').value=q;
searchVanced();
}
async function searchVanced(){
let query=document.getElementById('q').value||'bhojpuri song';
let grid=document.getElementById('grid');
grid.innerHTML='<div style="padding:20px;text-align:center">Loading '+query+'...</div>';
try{
let r=await fetch('https://pipedapi.kavin.rocks/search?q='+encodeURIComponent(query));
let d=await r.json();
grid.innerHTML='';
d.items.filter(x=>x.type==='stream').slice(0,20).forEach(v=>{
let id=v.url.split('v=')[1]||v.url.split('/').pop();
grid.innerHTML+=`<div class="card" onclick="playV('${id}','${v.title.replace(/'/g,'')}')">
<div class="thumb"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"><span class="audio">((•))</span></div>
<div style="padding:8px 10px"><div style="font-size:14px;line-height:1.3">${v.title}</div><div style="font-size:12px;color:#aaa;margin-top:4px">${v.uploaderName} • ${v.uploaderName.includes('Mix')?'Mix - ':''}${query}</div></div></div>`;
});
}catch(e){grid.innerHTML='<div style="padding:20px">Offline hai, fir search dabao</div>'}
}
function playV(id,title){
document.getElementById('player').style.display='block';
document.getElementById('vt').innerText=title;
document.getElementById('box').innerHTML=`<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" frameborder="0" allowfullscreen></iframe>`;
}
function toggleAudio(){alert('Background Play ON! Ab phone lock karke bhi gana bajega - Vanced Feature!')}
searchVanced();
</script>
</body>
</html>
